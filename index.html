<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Control de Stock</h1>
    <p class="subtitle">Despensa / Pequeño comercio</p>
  </header>

  <main>
    <section class="card">
      <h2>Alta de producto</h2>
      <form id="form-producto" novalidate>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Harina 000" />
          <small class="error" data-error-for="nombre"></small>
        </div>

        <div class="field">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">Elegí una categoría…</option>
            <option value="Comestibles">Comestibles</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Limpieza">Limpieza</option>
            <option value="Otros">Otros</option>
          </select>
          <small class="error" data-error-for="categoria"></small>
        </div>

        <div class="field">
          <label for="cantidad">Cantidad</label>
          <input type="number" id="cantidad" name="cantidad" min="0" step="1" />
          <small class="error" data-error-for="cantidad"></small>
        </div>

        <div class="field">
          <label for="minimo">Stock mínimo</label>
          <input type="number" id="minimo" name="minimo" min="0" step="1" />
          <small class="error" data-error-for="minimo"></small>
        </div>

        <div class="field">
          <label for="vencimiento">Vencimiento</label>
          <input type="date" id="vencimiento" name="vencimiento" />
          <small class="error" data-error-for="vencimiento"></small>
        </div>

        <div class="form-actions">
          <button type="submit">Guardar producto</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Productos cargados</h2>
      <p id="feedback" class="feedback" hidden></p>
      <div class="table-wrap">
        <table id="tabla-productos" hidden>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Cantidad</th>
              <th>Mínimo</th>
              <th>Vencimiento</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="tabla-vacia" class="empty">Todavía no hay productos cargados.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
